[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abac-kit"
version = "0.1.0"
description = "Attribute-based access control (ABAC) engine for Django and Django REST Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Qudra" }]
keywords = ["abac", "authorization", "access-control", "django", "drf", "permissions", "rbac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
]

[project.urls]
Homepage = "https://github.com/Qudra-IO/abac-kit"
Repository = "https://github.com/Qudra-IO/abac-kit"
Issues = "https://github.com/Qudra-IO/abac-kit/issues"

[tool.setuptools.packages.find]
include = ["abac_kit*"]

[tool.setuptools.package-data]
abac_kit = ["py.typed"]
